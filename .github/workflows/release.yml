name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  NODE_VERSION: '20'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Use official Electron binary hosts
        run: |
          npm config delete electron_mirror --location=project
          npm config delete electron_builder_binaries_mirror --location=project

      - name: Resolve version from tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Resolved VERSION=${VERSION} from tag ${TAG}"

      - name: Install dependencies
        run: npm ci

      - name: Set package.json version
        shell: bash
        run: npm version "${VERSION}" --no-git-tag-version --allow-same-version

      - name: Build Windows NSIS installer
        run: npm run dist:win

      - name: Zip Setup.exe
        shell: pwsh
        run: |
          $exe = "release/PwdBook-${env:VERSION}-Setup.exe"
          $zip = "release/PwdBook-${env:VERSION}-Setup.zip"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Missing NSIS installer: $exe"
          }
          if (Test-Path -LiteralPath $zip) {
            Remove-Item -LiteralPath $zip -Force
          }
          Compress-Archive -LiteralPath $exe -DestinationPath $zip
          Write-Host "Created $zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/PwdBook-*-Setup.zip
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Use official Electron binary hosts
        run: |
          npm config delete electron_mirror --location=project
          npm config delete electron_builder_binaries_mirror --location=project

      - name: Install AppImage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2

      - name: Resolve version from tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Resolved VERSION=${VERSION} from tag ${TAG}"

      - name: Install dependencies
        run: npm ci

      - name: Set package.json version
        run: npm version "${VERSION}" --no-git-tag-version --allow-same-version

      - name: Build Linux AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npm run dist:linux

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: release/PwdBook-*.AppImage
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Use official Electron binary hosts
        run: |
          npm config delete electron_mirror --location=project
          npm config delete electron_builder_binaries_mirror --location=project

      - name: Resolve version from tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Resolved VERSION=${VERSION} from tag ${TAG}"

      - name: Install dependencies
        run: npm ci

      - name: Set package.json version
        run: npm version "${VERSION}" --no-git-tag-version --allow-same-version

      - name: Build macOS DMGs
        run: npm run dist:mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            release/PwdBook-*-x64.dmg
            release/PwdBook-*-arm64.dmg
          if-no-files-found: error

  publish-release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: artifacts/*
          fail_on_unmatched_files: true
